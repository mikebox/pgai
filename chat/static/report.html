<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ABC Credit Model Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..650&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #fafaf8; --surface: #ffffff; --subtle: #f7f7f5; --hover: #f3f2ee;
    --text: #1a1a18; --text-2: #5f5e5a; --text-3: #8f8d87;
    --line: #e8e6e1; --line-strong: #d6d3cc;
    --accent: #c96442; --accent-soft: #fbf1ec;
    --err: #b42318; --err-soft: #fef3f2; --ok: #2f7d4f; --ok-soft: #eef7f1;
    --warn: #8a5a00; --warn-soft: #fff8e6;
    --shadow: 0 1px 2px rgba(20,20,15,.04), 0 4px 16px rgba(20,20,15,.05);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 110px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--sans);
         font-feature-settings: "cv11", "ss03", "tnum"; -webkit-font-smoothing: antialiased; letter-spacing: -.006em; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: var(--accent); }

  .top { position: sticky; top: 0; z-index: 3; background: rgba(250,250,248,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .top .wrap { display: flex; align-items: center; gap: 12px; height: 52px; max-width: 1320px; }
  .brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-weight: 600; letter-spacing: -.018em; }
  .mark { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 13px/1 var(--sans); }
  .tag { font-size: 12px; color: var(--text-3); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-weight: 500; }
  .nav { display: flex; gap: 2px; margin-left: 14px; }
  .nav a { color: var(--text-2); text-decoration: none; font-size: 13.5px; padding: 6px 10px; border-radius: 8px; font-weight: 500; }
  .nav a:hover { background: var(--hover); color: var(--text); }
  .nav a.on { color: var(--text); background: var(--surface); box-shadow: 0 0 0 1px var(--line) inset; }

  .subnav { position: sticky; top: 52px; z-index: 2; background: rgba(250,250,248,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .subnav .wrap { display: flex; gap: 4px; overflow-x: auto; height: 44px; align-items: center; scrollbar-width: none; }
  .subnav a { flex: none; color: var(--text-2); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 999px; }
  .subnav a:hover { background: var(--hover); color: var(--text); }
  .subnav a.on { background: var(--accent-soft); color: var(--accent); }

  h1 { font-size: 22px; font-weight: 600; letter-spacing: -.025em; margin: 24px 0 6px; }
  .meta-line { color: var(--text-3); font-size: 13px; margin-bottom: 18px; }
  section { padding: 8px 0 28px; }
  h2 { font-size: 17px; font-weight: 600; letter-spacing: -.02em; margin: 12px 0 4px; }
  .lead { color: var(--text-2); margin: 0 0 14px; max-width: 760px; }
  h3 { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
  .grid { display: grid; gap: 12px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .kpi .k { font-size: 12px; color: var(--text-3); }
  .kpi .v { font-size: 22px; font-weight: 600; letter-spacing: -.03em; margin-top: 2px; }
  .kpi .n { font-size: 12px; color: var(--text-3); }

  .takeaways { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .takeaways li { display: flex; gap: 10px; }
  .takeaways .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; }
  .dot.ok { background: var(--ok-soft); color: var(--ok); } .dot.warn { background: var(--warn-soft); color: var(--warn); } .dot.info { background: var(--accent-soft); color: var(--accent); }

  .steps { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
  .step { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; position: relative; }
  .step::before { counter-increment: s; content: counter(s); position: absolute; top: 10px; right: 12px; font-size: 12px; color: var(--text-3); }
  .step b { display: block; font-size: 13.5px; margin-bottom: 4px; }
  .step p { margin: 0; font-size: 12.5px; color: var(--text-2); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-3); padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--subtle); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tbl { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; overflow-x: auto; background: var(--surface); }
  .best td { background: var(--accent-soft); font-weight: 600; }
  .hbar { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .hbar i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }
  .muted { color: var(--text-3); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; border: 1px solid var(--line); background: var(--subtle); border-radius: 999px; padding: 2px 10px; }
  .chip.drop { color: var(--text-3); text-decoration: line-through; }
  dl { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; margin: 0; }
  dt { color: var(--text-3); } dd { margin: 0; }

  .cm { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 6px; font-size: 13px; }
  .cm .h { color: var(--text-3); font-size: 12px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px; }
  .cm .r { color: var(--text-3); font-size: 12px; display: flex; align-items: center; }
  .cm .c { border-radius: 10px; padding: 12px; text-align: center; }
  .cm .c b { display: block; font-size: 20px; letter-spacing: -.02em; }
  .cm .c small { font-size: 12px; }
  .c.good { background: var(--ok-soft); color: var(--ok); } .c.bad { background: var(--err-soft); color: var(--err); }
  .meter { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 6px 0 2px; }
  .meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .cmp { display: grid; grid-template-columns: 1fr auto auto; gap: 8px 16px; align-items: center; }
  .cmp .hd { font-size: 12px; color: var(--text-3); }
  .note { font-size: 12.5px; color: var(--text-3); margin-top: 10px; }
  .warn-box { background: var(--warn-soft); color: var(--warn); border: 1px solid #f5e3b3; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }

  .figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .fig { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: zoom-in; text-align: left; padding: 0; }
  .fig:hover { border-color: var(--line-strong); }
  .fig img { width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; display: block; border-bottom: 1px solid var(--line); }
  .fig div { padding: 10px 12px; } .fig b { font-size: 13.5px; } .fig p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-2); }
  .filter { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .filter button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text-2); }
  .filter button.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  .lightbox { position: fixed; inset: 0; background: rgba(20,20,15,.7); display: none; z-index: 10; padding: 24px; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 100%; max-height: calc(100vh - 110px); background: #fff; border-radius: 10px; }
  .lightbox .cap { color: #fff; text-align: center; max-width: 760px; font-size: 13.5px; }
  .lightbox .x { position: absolute; top: 14px; right: 16px; background: rgba(255,255,255,.15); color: #fff; border: 0; width: 34px; height: 34px; border-radius: 50%; font-size: 20px; }

  .md { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 24px 20px; max-width: 900px; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 16px; margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); }
  .md table { margin: 10px 0; border: 1px solid var(--line); font-size: 13px; display: block; overflow-x: auto; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--subtle); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--subtle); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md hr { border: 0; border-top: 1px solid var(--line); }
  details > summary { cursor: pointer; font-weight: 500; color: var(--text-2); padding: 6px 0; }

  .err { background: var(--err-soft); color: var(--err); border-radius: 10px; padding: 10px 14px; margin: 16px 0; }

  @media (max-width: 1000px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } .steps { grid-template-columns: repeat(3, minmax(0, 1fr)); } .figs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 680px) { .g2, .g3 { grid-template-columns: 1fr; } .kpis, .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); } .figs { grid-template-columns: 1fr; } dl { grid-template-columns: 120px 1fr; } .nav { margin-left: 4px; } .tag { display: none; } .md { padding: 4px 14px 16px; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="mark">A</span>ABC Credit <span class="tag">Admin</span></div>
  <nav class="nav"><a href="/admin">Applications</a><a href="/admin/report" class="on">Model report</a></nav>
</div></header>
<div class="subnav"><div class="wrap" id="subnav">
  <a href="#overview">Overview</a><a href="#training">How it was trained</a><a href="#test">Test results</a>
  <a href="#figures">Figures</a><a href="#full">Full report</a>
</div></div>

<main class="wrap" id="main">
  <h1>Model report</h1>
  <div class="meta-line" id="meta-line">Loading…</div>
  <div id="content"></div>
</main>

<div class="lightbox" id="lb"><button class="x" id="lb-x" aria-label="Close">×</button><img id="lb-img" alt=""><div class="cap" id="lb-cap"></div></div>

<script>
// Folder the app is served from: "" at the domain root, "/loan" under pgpem.in/loan/ (works for both).
const BASE = location.pathname.replace(/\/(index\.html|admin(\/report)?)?\/?$/, "");
document.querySelectorAll('a[href^="/"]').forEach(a => a.setAttribute("href", BASE + a.getAttribute("href")));
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (x, d = 1) => x == null ? "—" : (x * 100).toFixed(d) + "%";
const f3 = (x) => x == null ? "—" : x.toFixed(3);
const num = (x) => x == null ? "—" : Math.round(x).toLocaleString("en-IN");
const dur = (s) => s == null ? "—" : s < 60 ? Math.round(s) + "s" : `${Math.floor(s / 60)}m ${String(Math.round(s % 60)).padStart(2, "0")}s`;
const FEATURE_LABELS = {
  Age: "Age", Loan_Amount: "Loan amount", LTV: "LTV (loan ÷ price)", vehicle_value: "Vehicle value", down_payment: "Down payment",
  tier_ord: "City tier (from pincode)", ltv_missing: "LTV missing flag", Employment_Type: "Employment type",
  PAST_LOANS_ACTIVE: "Active past loans", Product_Code: "Product type", Make_Code: "Make", Model_Variant: "Variant",
  pin2: "Postal circle (2-digit pincode)", pin3: "District (3-digit pincode)", Model_Description: "Vehicle model",
  Pincode: "Pincode", Vehicle_Price: "Vehicle price",
};
const SECTIONS = { all: "All", data: "Data analysis", features: "Feature selection", threshold: "Threshold", test: "Test results" };

async function main() {
  let r;
  try {
    const res = await fetch(BASE + "/api/admin/report");
    r = await res.json();
    if (!res.ok) throw new Error(r.error || res.statusText);
  } catch (e) {
    $("meta-line").textContent = "";
    $("content").innerHTML = `<div class="err">Couldn't load the report: ${esc(e.message)}</div>`;
    return;
  }
  const m = r.model, rank = r.metrics.internal_test_ranking || {}, at = r.metrics.internal_test_at_threshold || {};
  const cm = (r.metrics.internal_test_confusion_matrix || {}).matrix || [[0, 0], [0, 0]];
  const [[tn, fp], [fn, tp]] = cm;
  const testN = tn + fp + fn + tp, cv = r.metrics.cv5_train || [], lat = r.metrics.latency_ms || {};
  const thr = m.threshold ?? at.threshold;
  // Benchmarks on the same test set: (a) approve everyone, (b) random model that declines the same share as ours.
  const N = tn + fp + fn + tp, prev = (fn + tp) / N, d = at.decline_rate ?? (fp + tp) / N;
  const bench = {
    model: { acc: at.accuracy, prec: at.precision_DECLINED, rec: at.recall_DECLINED, bal: at.balanced_accuracy },
    random: { acc: d * prev + (1 - d) * (1 - prev), prec: prev, rec: d, bal: 0.5 },
    approve: { acc: 1 - prev, prec: null, rec: 0, bal: 0.5 },
  };
  const cell = (v, ref, higher = true) => {
    if (v == null) return `<td class="num muted">n/a</td>`;
    const win = ref != null && (higher ? v > ref : v < ref);
    return `<td class="num">${pct(v)}${ref != null ? ` <span style="color:var(${win ? "--ok" : "--err"})">${win ? "▲" : "▼"}</span>` : ""}</td>`;
  };
  const benchmark = () => `<div class="card" style="margin-bottom:12px"><h3>Accuracy, precision and recall vs benchmarks · test set, threshold ${thr}</h3>
    <div class="tbl"><table>
      <thead><tr><th></th><th class="num">Accuracy</th><th class="num">Balanced accuracy</th><th class="num">Precision (declined)</th><th class="num">Recall (declined)</th></tr></thead>
      <tbody>
        <tr class="best"><td>Our model</td><td class="num">${pct(bench.model.acc)}</td><td class="num">${pct(bench.model.bal)}</td><td class="num">${pct(bench.model.prec)}</td><td class="num">${pct(bench.model.rec)}</td></tr>
        <tr><td>Random model, declining the same ${pct(d, 0)} <span class="muted">(benchmark)</span></td>${cell(bench.random.acc, bench.model.acc, false)}${cell(bench.random.bal, bench.model.bal, false)}${cell(bench.random.prec, bench.model.prec, false)}${cell(bench.random.rec, bench.model.rec, false)}</tr>
        <tr><td>Approve everyone <span class="muted">(benchmark)</span></td>${cell(bench.approve.acc, bench.model.acc, false)}${cell(bench.approve.bal, bench.model.bal, false)}${cell(bench.approve.prec, bench.model.prec, false)}${cell(bench.approve.rec, bench.model.rec, false)}</tr>
      </tbody></table></div>
    <p class="note">▲ = our model beats this benchmark, ▼ = the benchmark scores higher. Against a random model that declines the same share of applicants, ours is ${(bench.model.prec / bench.random.prec).toFixed(1)}× as precise and catches ${(bench.model.rec / bench.random.rec).toFixed(1)}× as many risky applicants. "Approve everyone" has higher plain accuracy (${pct(bench.approve.acc)}) only because ${pct(1 - prev, 0)} of applicants are good; it catches no risky applicants, so plain accuracy isn't a useful target with this imbalance. Balanced accuracy, which weighs both classes equally, is the fair accuracy comparison.</p></div>`;
  const trained = m.trained_at ? new Date(m.trained_at).toLocaleString(undefined, { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "—";
  $("meta-line").textContent = `${m.model || "Model"} · trained ${trained} · ${num(m.trained_on_rows)} labelled rows · scikit-learn ${m.sklearn_version || "?"}`;

  let h = "";
  // ---- overview ----
  h += `<section id="overview"><h2>Overview</h2>
    <p class="lead">The chatbot collects ${m.raw_input_fields ? m.raw_input_fields.length : 7} answers and this model turns them into a probability that the application should be declined. Anything at or above ${pct(thr, 0)} is declined.</p>
    <div class="kpis">
      <div class="kpi"><div class="k">ROC-AUC (test)</div><div class="v">${f3(rank["ROC-AUC"])}</div><div class="n">0.5 = random, 1 = perfect</div></div>
      <div class="kpi"><div class="k">PR-AUC (test)</div><div class="v">${f3(rank["PR-AUC"])}</div><div class="n">random ${f3(rank["PR-AUC of random model"])} · ${(rank["PR-AUC"] / rank["PR-AUC of random model"]).toFixed(1)}× better</div></div>
      <div class="kpi"><div class="k">Risky applicants caught</div><div class="v">${pct(at.recall_DECLINED)}</div><div class="n">recall on DECLINED</div></div>
      <div class="kpi"><div class="k">Good applicants approved</div><div class="v">${pct(at.recall_APPROVED)}</div><div class="n">recall on APPROVED</div></div>
      <div class="kpi"><div class="k">Decision threshold</div><div class="v">${thr}</div><div class="n">${esc(m.decision_rule || "")}</div></div>
      <div class="kpi"><div class="k">Scoring latency p50</div><div class="v">${lat.p50_ms != null ? Math.round(lat.p50_ms) + " ms" : "—"}</div><div class="n">p95 ${lat.p95_ms != null ? Math.round(lat.p95_ms) + " ms" : "—"} · target 1 s</div></div>
    </div>
    ${benchmark()}
    <div class="card"><h3>What the results mean</h3><ul class="takeaways">
      <li><span class="dot ok">✓</span><div><b>It ranks risk well for the data available.</b> Shown a random declined and a random approved applicant, it gives the declined one the higher risk score ${pct(rank["ROC-AUC"], 0)} of the time. Adding every remaining field doesn't improve this, so ~0.78 is close to what these fields allow.</div></li>
      <li><span class="dot info">↯</span><div><b>The threshold is set by cost, not accuracy.</b> Wrongly approving a risky applicant costs about 10× more than wrongly declining a good one, so the model declines from ${pct(thr, 0)} risk. That catches ${pct(at.recall_DECLINED, 0)} of risky applicants while declining ${pct(at.decline_rate, 0)} of all applicants. The default 0.5 threshold would score 94.7% accuracy but catch none.</div></li>
      <li><span class="dot warn">!</span><div><b>Most declines are precautionary.</b> Only ${pct(at.precision_DECLINED, 0)} of declined applicants were actually declined historically; the original decisions used information (such as bureau data) this dataset doesn't contain. Approvals are reliable: ${pct(at.precision_APPROVED, 1)} of approved applicants were truly good.</div></li>
      <li><span class="dot ok">✓</span><div><b>Short and fast.</b> Feature selection cut 10 candidate questions to 7 with no loss in accuracy, and scoring takes well under the 1-second budget.</div></li>
    </ul></div>
  </section>`;

  // ---- training ----
  const best = cv.reduce((b, x) => (x["ROC-AUC"] > (b?.["ROC-AUC"] ?? 0) ? x : b), null);
  const minA = 0.5, maxA = Math.max(...cv.map((x) => x["ROC-AUC"]), 0.8);
  const fs = m.feature_spec || {};
  const engineered = [...(fs.numeric || []), ...(fs.low_card || []), ...(fs.high_card || [])];
  h += `<section id="training"><h2>How it was trained</h2>
    <p class="lead">Historical two-wheeler loan decisions were cleaned, reduced to the questions that matter, and used to compare several models with 5-fold cross-validation. The winner was tuned, given a cost-based threshold, and checked once on a held-out test set.</p>
    <div class="steps">
      <div class="step"><b>Data</b><p>108,423 historical applications; only 5.3% declined.</p></div>
      <div class="step"><b>Cleaning</b><p>Duplicates, impossible values and encoding errors fixed; nothing learned from test data.</p></div>
      <div class="step"><b>Feature selection</b><p>Questions added one at a time; AUC plateaus at 7.</p></div>
      <div class="step"><b>Model comparison</b><p>${cv.length} models, 5-fold CV on the 80% training split.</p></div>
      <div class="step"><b>Threshold</b><p>Chosen to minimise expected cost at 10 : 1.</p></div>
      <div class="step"><b>Test</b><p>Scored once on the 20% held-out split (${num(testN)} rows).</p></div>
    </div>
    <div style="height:12px"></div>
    <div class="grid g2">
      <div class="card"><h3>Questions the model uses</h3><div class="chips">
        ${(m.raw_input_fields || []).filter((f) => f !== "LTV").map((f) => `<span class="chip">${esc(FEATURE_LABELS[f] || f)}</span>`).join("")}
        <span class="chip">Vehicle price</span>
      </div>
      <h3 style="margin-top:16px">Not asked (no measurable gain or protected)</h3><div class="chips">
        <span class="chip drop">Net salary</span><span class="chip drop">Qualifications</span><span class="chip drop">Resident type</span><span class="chip drop">Gender</span>
      </div>
      <h3 style="margin-top:16px">Features the model actually sees (${engineered.length})</h3><div class="chips">
        ${engineered.map((f) => `<span class="chip">${esc(FEATURE_LABELS[f] || f)}</span>`).join("")}
      </div></div>
      <div class="card"><h3>Final model</h3><dl>
        <dt>Algorithm</dt><dd>${esc(m.model)}</dd>
        ${Object.entries(m.hyperparameters || {}).map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd class="mono">${typeof v === "number" ? +v.toFixed(4) : esc(v)}</dd>`).join("")}
        <dt>Cost assumption</dt><dd>risky approved = ${m.cost_assumption?.cost_fn_risky_approved ?? 10} × good declined</dd>
        <dt>Trained on</dt><dd>${num(m.trained_on_rows)} rows (all labelled data, refit after testing)</dd>
        <dt>Positive class</dt><dd>${esc(m.positive_class)}</dd>
      </dl></div>
    </div>
    <div style="height:12px"></div>
    <div class="card"><h3>Model comparison · 5-fold cross-validation on training data</h3><div class="tbl"><table>
      <thead><tr><th>Model</th><th class="num">ROC-AUC</th><th class="num">± sd</th><th class="num">PR-AUC</th><th class="num">Brier</th><th class="num">Fit time / fold</th></tr></thead>
      <tbody>${cv.map((x) => `<tr class="${x === best ? "best" : ""}">
        <td>${esc(x.model)}${x === best ? " ✓" : ""}</td>
        <td class="num"><span class="hbar"><i style="width:${Math.max(2, 80 * (x["ROC-AUC"] - minA) / (maxA - minA))}px"></i>${f3(x["ROC-AUC"])}</span></td>
        <td class="num muted">${f3(x["ROC-AUC sd"])}</td><td class="num">${f3(x["PR-AUC"])}</td>
        <td class="num">${x.Brier == null ? "—" : x.Brier.toFixed(4)}</td><td class="num muted">${x["fit s/fold"] != null ? x["fit s/fold"].toFixed(1) + " s" : "—"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="note">Lower Brier = better-calibrated probabilities. Balanced class weights hurt calibration badly (Brier 0.198), which is why imbalance is handled with the threshold instead.</p></div>
  </section>`;

  // ---- test ----
  h += `<section id="test"><h2>Test results</h2>
    <p class="lead">Scored once on ${num(testN)} applications the model never saw during training or tuning, at threshold ${thr}.</p>
    <div class="grid g2">
      <div class="card"><h3>Confusion matrix</h3>
        <div class="cm">
          <div></div><div class="h">Predicted APPROVED</div><div class="h">Predicted DECLINED</div>
          <div class="r">Actually APPROVED</div>
          <div class="c good"><b>${num(tn)}</b><small>correctly approved</small></div>
          <div class="c bad"><b>${num(fp)}</b><small>good applicants declined</small></div>
          <div class="r">Actually DECLINED</div>
          <div class="c bad"><b>${num(fn)}</b><small>risky applicants approved</small></div>
          <div class="c good"><b>${num(tp)}</b><small>risky applicants caught</small></div>
        </div>
        <p class="note">Accuracy ${pct(at.accuracy)} · balanced accuracy ${pct(at.balanced_accuracy)} · ${pct(at.decline_rate)} of applicants declined.</p>
      </div>
      <div class="card"><h3>Scores by class</h3><div class="tbl"><table>
        <thead><tr><th></th><th class="num">Precision</th><th class="num">Recall</th><th class="num">F1</th></tr></thead>
        <tbody>
          <tr><td>DECLINED (risky)</td><td class="num">${f3(at.precision_DECLINED)}</td><td class="num"><b>${f3(at.recall_DECLINED)}</b></td><td class="num">${f3(at.f1_DECLINED)}</td></tr>
          <tr><td>APPROVED (good)</td><td class="num">${f3(at.precision_APPROVED)}</td><td class="num">${f3(at.recall_APPROVED)}</td><td class="num">${f3(at.f1_APPROVED)}</td></tr>
        </tbody></table></div>
        <h3 style="margin-top:16px">Ranking (threshold-free)</h3><dl>
          <dt>ROC-AUC</dt><dd>${f3(rank["ROC-AUC"])}</dd>
          <dt>PR-AUC</dt><dd>${f3(rank["PR-AUC"])} <span class="muted">(random ${f3(rank["PR-AUC of random model"])})</span></dd>
          <dt>Brier score</dt><dd>${rank.Brier != null ? rank.Brier.toFixed(4) : "—"}</dd>
        </dl>
        <h3 style="margin-top:16px">Scoring latency</h3><dl>
          ${["p50", "p95", "p99", "max"].map((k) => `<dt>${k}</dt><dd>${lat[k + "_ms"] != null ? lat[k + "_ms"].toFixed(0) + " ms" : "—"}</dd>`).join("")}
        </dl>
      </div>
    </div>
  </section>`;

  // ---- figures ----
  const secs = ["all", ...new Set(r.figures.map((f) => f.section))];
  h += `<section id="figures"><h2>Figures</h2><p class="lead">Charts produced by the training notebooks. Click one to enlarge.</p>
    <div class="filter" id="fig-filter">${secs.map((s, i) => `<button data-s="${s}" class="${i ? "" : "on"}">${SECTIONS[s] || s}</button>`).join("")}</div>
    <div class="figs" id="figs">${r.figures.map((f) => `<button class="fig" data-s="${f.section}" data-src="${BASE}/reports/figures/${encodeURIComponent(f.file)}" data-cap="${esc(f.title + (f.caption ? " — " + f.caption : ""))}">
      <img loading="lazy" src="${BASE}/reports/figures/${encodeURIComponent(f.file)}" alt="${esc(f.title)}"><div><b>${esc(f.title)}</b><p>${esc(f.caption)}</p></div></button>`).join("")}</div>
  </section>`;

  // ---- full report ----
  h += `<section id="full"><h2>Full report</h2><p class="lead">The written report from <span class="mono">reports/report.md</span>.</p>
    ${lat.p50_ms && /p50 ≈ (\d+) ms/.test(r.report_md) && Math.abs(+RegExp.$1 - lat.p50_ms) > 10 ? `<div class="warn-box" style="margin:0 0 12px">The written report quotes latency p50 ≈ ${RegExp.$1} ms, but the latest measurement in metrics.json is ${Math.round(lat.p50_ms)} ms. The figures above use metrics.json.</div>` : ""}
    <div class="md" id="md"></div></section>`;

  $("content").innerHTML = h;
  $("md").innerHTML = window.marked ? marked.parse(r.report_md) : `<pre>${esc(r.report_md)}</pre>`;

  $("fig-filter").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("fig-filter").children].forEach((x) => x.classList.toggle("on", x === b));
    [...$("figs").children].forEach((f) => { f.style.display = b.dataset.s === "all" || f.dataset.s === b.dataset.s ? "" : "none"; });
  });
  $("figs").addEventListener("click", (e) => {
    const f = e.target.closest(".fig"); if (!f) return;
    $("lb-img").src = f.dataset.src; $("lb-cap").textContent = f.dataset.cap; $("lb").classList.add("on");
  });
  spy();
}

function closeLb() { $("lb").classList.remove("on"); }
$("lb").addEventListener("click", (e) => { if (e.target !== $("lb-img")) closeLb(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLb(); });

function spy() {
  const links = [...$("subnav").querySelectorAll("a")];
  const obs = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) links.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id)); });
  }, { rootMargin: "-120px 0px -60% 0px" });
  document.querySelectorAll("section[id]").forEach((s) => obs.observe(s));
}
main();
</script>
</body>
</html>
